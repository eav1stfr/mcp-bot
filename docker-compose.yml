# Local Postgres for development. Production uses Neon.
name: couple-bot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: couple_bot
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
